name: Auto Build and Release

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Calculate Version from Commits
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$COMMIT_COUNT" >> $GITHUB_ENV
          # Auto map commits to a version name like 1.0.X
          MINOR=$((COMMIT_COUNT % 100))
          echo "VERSION_NAME=1.0.$MINOR" >> $GITHUB_ENV

      - name: Update Version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ env.VERSION_CODE }}/g" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ env.VERSION_NAME }}"/g' app/build.gradle

      - name: Build APK (Debug/Release)
        run: ./gradlew assembleDebug

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.VERSION_CODE }}
          name: Release v1.0.${{ env.VERSION_CODE }}
          files: app/build/outputs/apk/debug/*.apk
          body: "Automated build generated via AllensCreations/apk-builder framework."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
