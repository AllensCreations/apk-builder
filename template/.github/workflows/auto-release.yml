name: Auto Build and Release

on:
  push:
    branches: [ "main", "master" ]

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version-code: ${{ steps.version.outputs.v_code }}
      version-name: ${{ steps.version.outputs.v_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "v_code=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          MINOR=$((COMMIT_COUNT % 100))
          echo "v_name=1.0.$MINOR" >> $GITHUB_OUTPUT

  call-build:
    needs: calculate-version
    uses: AllensCreations/apk-builder/.github/workflows/build-apk.yml@main
    with:
      version-code: ${{ needs.calculate-version.outputs.version-code }}
      version-name: ${{ needs.calculate-version.outputs.version-name }}

  release:
    needs: [calculate-version, call-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-apk
          path: ./apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ needs.calculate-version.outputs.version-code }}
          name: Release v1.0.${{ needs.calculate-version.outputs.version-code }}
          files: ./apk/*.apk
          body: "Automated build generated via AllensCreations/apk-builder framework."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
