name: Reusable APK Build Workflow

on:
  workflow_call:
    inputs:
      version-code:
        required: false
        type: string
        default: '1'
      version-name:
        required: false
        type: string
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Ensure Android Manifest and Essential Resources Exist
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          
          # Create AndroidManifest if missing
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.Light.DarkActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          fi

          # Create strings.xml if app_name string is missing
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            echo '<resources><string name="app_name">AutoApp</string></resources>' > app/src/main/res/values/strings.xml
          elif ! grep -q "app_name" app/src/main/res/values/strings.xml; then
            sed -i '/<resources>/a <string name="app_name">AutoApp<\/string>' app/src/main/res/values/strings.xml
          fi
          
          # Create a dummy icon placeholder to satisfy AAPT requirements if missing
          if [ ! -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            # Generates a tiny blank 1x1 transparent png fallback if icon assets are totally absent
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png 2>/dev/null || true
          fi

      - name: Update Version in build.gradle
        run: |
          if [ -f "app/build.gradle" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version-code }}/g" app/build.gradle
            sed -i 's/versionName "[^"]*"/versionName "${{ inputs.version-name }}"/g' app/build.gradle
          fi

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: app/build/outputs/apk/debug/*.apk
