name: Reusable APK Build Workflow

on:
  workflow_call:
    inputs:
      version-code:
        required: false
        type: string
        default: '1'
      version-name:
        required: false
        type: string
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Ensure Android Manifest Exists
        run: |
          mkdir -p app/src/main
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="App"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          fi

      - name: Update Version in build.gradle
        run: |
          if [ -f "app/build.gradle" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version-code }}/g" app/build.gradle
            sed -i 's/versionName "[^"]*"/versionName "${{ inputs.version-name }}"/g' app/build.gradle
          fi

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: app/build/outputs/apk/debug/*.apk
