name: Reusable APK Build Workflow

on:
  workflow_call:
    inputs:
      version-code:
        required: false
        type: string
        default: '1'
      version-name:
        required: false
        type: string
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Setup WebView Assets and Manifest
        run: |
          mkdir -p app/src/main/assets/views
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          # If views folder exists in repository root, copy contents to Android assets
          if [ -d "views" ]; then
            cp -r views/* app/src/main/assets/views/
          elif [ ! -f "app/src/main/assets/views/index.html" ]; then
            echo '<html><body><h1>Welcome to AutoRelease WebView</h1></body></html>' > app/src/main/assets/views/index.html
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          fi

          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            echo '<resources><string name="app_name">WebViewApp</string></resources>' > app/src/main/res/values/strings.xml
          fi

          if [ ! -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png 2>/dev/null || true
          fi

      - name: Update Version in build.gradle
        run: |
          if [ -f "app/build.gradle" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version-code }}/g" app/build.gradle
            sed -i 's/versionName "[^"]*"/versionName "${{ inputs.version-name }}"/g' app/build.gradle
          fi

      - name: Build APK with Diagnostics
        run: |
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" --stacktrace || exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: app/build/outputs/apk/debug/*.apk
